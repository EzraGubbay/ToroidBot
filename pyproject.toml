[project]
name = "ctf-poc"
version = "0.1.0"
description = "AI-powered CTF challenge generator using Pydantic-AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=1.96.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ctf-poc = "orchestrator.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100
